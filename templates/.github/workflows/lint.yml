name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv has published only immutable tags since v8, so pin the full version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # A committed .python-version is required: without it `uv python install`
      # picks the newest CPython that requires-python allows, so CI silently
      # moves to a release that dependencies may not support yet.
      - name: Set up Python from the committed .python-version
        run: |
          if [ ! -f .python-version ]; then
            echo "::error file=.python-version::Commit a .python-version (e.g. 3.12) so CI tests a deliberately chosen Python."
            exit 1
          fi
          uv python install

      # `uv sync` includes the `dev` dependency group by default when it exists
      # and does not fail in repos that keep ruff elsewhere.
      - name: Sync dev dependencies
        run: uv sync --frozen

      # uv.lock is the single source of truth for the ruff version; fail if
      # .pre-commit-config.yaml reintroduces a remote ruff pin that drifts.
      - name: ruff hook agrees with uv.lock
        run: uv run acidbase hooks .

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  gitleaks:
    name: gitleaks (CLI, MIT)
    runs-on: ubuntu-latest
    env:
      # Pin explicitly; bump both together, deliberately. Never use 'latest'.
      # The digest is the linux_x64 line of the release's checksums file.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --retry 5 -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks scan
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner

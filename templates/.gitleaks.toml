# Canonical gitleaks config for the a6a ecosystem.
# Extends the upstream default ruleset; add repo-specific allowlists below.

[extend]
useDefault = true

[allowlist]
description = "Ecosystem-wide allowlist"
# Paths that are safe by convention. Docs and changelogs stay scanned, because that is where a
# pasted credential tends to land; a false positive goes in .gitleaksignore by full fingerprint.
paths = [
    '''\.gitleaks\.toml$''',
    '''.*\.lock$''',
]
# Token placeholders we use in .env.example files.
regexes = [
    '''api_key_here''',
    '''db_user''',
    '''db_password''',
    '''placeholder''',
    '''example[_-]?token''',
    '''\{\{[A-Z0-9_]+\}\}''',
]

# The upstream rules look for assignments, so they miss a password written as a SQL literal.
[[rules]]
id = "sql-password-literal"
description = "Literal password in a SQL role statement"
regex = '''(?i)\b(?:alter|create)\s+(?:role|user)\b[^;\n]*?\b(?:password|identified\s+(?:with\s+\S+\s+)?by)\s+'([^'\n]{4,})[']'''
secretGroup = 1
keywords = ["password", "identified"]

[[rules.allowlists]]
description = "Variables from shell, Python and templates, and REAL placeholders"
regexes = [
    '''^\$''',
    '''^%''',
    '''^\{''',
    '''^<''',
    '''^REAL[A-Z0-9]*$''',
]
